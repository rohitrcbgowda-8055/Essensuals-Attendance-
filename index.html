<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<link rel="manifest" href="manifest.json">
<title>T&G Staff Attendance</title>
<script src="https://unpkg.com/html5-qrcode" defer></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f3f3;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
header{background:#111;color:#fff;padding:18px 15px}header b{font-size:20px}header small{display:block;color:#bbb;margin-top:3px}
nav{display:flex;gap:7px;overflow:auto;background:#fff;padding:10px;position:sticky;top:0;z-index:5;border-bottom:1px solid #ddd}nav button{border:1px solid #ddd;background:#fff;border-radius:10px;padding:9px 12px;white-space:nowrap}nav .on{background:#111;color:#fff}
main{max-width:900px;margin:auto;padding:12px 12px 50px}.card{background:#fff;border-radius:15px;padding:15px;margin:10px 0;box-shadow:0 2px 10px #00000010}
h2{font-size:20px;margin:2px 0 10px}.muted{color:#666;font-size:13px}.notice{background:#f0f0f0;border-radius:10px;padding:10px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
label{display:block;font-size:12px;color:#555;margin:7px 0 4px}input,select{width:100%;padding:11px;border:1px solid #ccc;border-radius:9px;font-size:15px;background:#fff}
button{cursor:pointer}.primary{background:#111;color:#fff;border:0;border-radius:10px;padding:11px 14px;font-weight:600}.green{background:#16803c;color:#fff;border:0;border-radius:10px;padding:10px 12px}.red{background:#b00020;color:#fff;border:0;border-radius:10px;padding:9px 11px}.outline{background:#fff;border:1px solid #aaa;border-radius:10px;padding:9px 12px}
.actions{display:flex;gap:7px;flex-wrap:wrap}.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#eee;font-size:12px}.present{background:#dff5e7}.absent{background:#ffe0e0}.leave{background:#fff0c8}.half{background:#e8e2ff}
.staff{border-top:1px solid #eee;padding:12px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}
.modal{position:fixed;inset:0;background:#000b;z-index:20;display:flex;align-items:center;justify-content:center;padding:12px}.box{background:#fff;border-radius:16px;padding:16px;width:100%;max-width:520px;max-height:94vh;overflow:auto}.hide{display:none!important}
#reader{width:100%;min-height:260px;border-radius:12px;overflow:hidden}.qrbox{display:flex;justify-content:center;align-items:center;background:#fff;padding:14px;border-radius:14px;border:1px solid #ddd}.qrbox img{width:min(70vw,360px);height:min(70vw,360px);image-rendering:auto}.timer{text-align:center;font-size:26px;font-weight:700;margin:8px}
video{width:100%;border-radius:12px;background:#111}.kpi{font-size:25px;font-weight:700}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid #eee;text-align:left}
</style></head>
<body>
<header><b>T&G Staff Attendance</b><small>TONI&GUY ESSENSUALS • RMV</small></header>
<nav id="nav"></nav><main id="app"></main>
<div id="modal" class="modal hide"><div class="box" id="box"></div></div>
<script>
const KEY="tg_staff_attendance_realqr_v2";
let D=JSON.parse(localStorage.getItem(KEY)||"null")||{staff:[],days:{},settings:{lat:null,lng:null,radius:100,qrSeconds:15,qrSecret:null}};
function save(){localStorage.setItem(KEY,JSON.stringify(D))}
function id(){return crypto.randomUUID?crypto.randomUUID():Date.now()+"-"+Math.random()}
function esc(x){return String(x??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function date(){return new Date().toISOString().slice(0,10)}
function clock(){return new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit",second:"2-digit"})}
function day(){return D.days[date()]||(D.days[date()]={})}
function token(){return "TGATT|"+(D.settings.qrSecret||"")+ "|" + Math.floor(Date.now()/1000/D.settings.qrSeconds)}
function distance(a,b,c,e){let R=6371000,p=Math.PI/180,x=(c-a)*p,y=(e-b)*p,q=Math.sin(x/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
function validToken(v){if(!v)return false;let z=v.split("|");return z.length===3&&z[0]=="TGATT"&&z[1]==D.settings.qrSecret&&z[2]==String(Math.floor(Date.now()/1000/D.settings.qrSeconds))}
function nav(t){document.getElementById("nav").innerHTML=["attendance","staff","monthly","salary","settings"].map(x=>`<button class="${t==x?"on":""}" onclick="render('${x}')">${x[0].toUpperCase()+x.slice(1)}</button>`).join("")+`<button onclick="reception()">Reception QR</button>`}
function render(t="attendance"){nav(t);({attendance,staff,monthly,salary,settings}[t])()}
function attendance(){let r=day();app.innerHTML=`<div class="card"><h2>Today's Attendance</h2><div class="muted">${new Date().toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"})}</div><p class="notice">Employee uses their own phone: <b>real QR scan → personal PIN → GPS → mandatory live selfie</b>.</p></div><div class="grid">${D.staff.map(s=>{let x=r[s.id];return `<div class="card"><b>${esc(s.name)}</b><p>${x?`<span class="badge ${x.status=="Present"?"present":x.status=="Absent"?"absent":x.status=="Leave"?"leave":"half"}">${x.status}</span><br><span class="muted">In: ${x.in||"—"}<br>Out: ${x.out||"—"}</span>`:`<span class="badge">Not checked in</span>`}</p>${x&&!x.out?`<button class="green" onclick="start('${s.id}','out')">Check out</button>`:!x?`<button class="primary" onclick="start('${s.id}','in')">Check in</button>`:""} <button class="outline" onclick="edit('${s.id}')">Manager edit</button></div>`}).join("")||`<div class="card">Add staff first.</div>`}</div>`}
function staff(){app.innerHTML=`<div class="card"><h2>Add Staff</h2><div class="grid"><div><label>Name</label><input id="sn"></div><div><label>Phone</label><input id="sp"></div><div><label>Monthly salary ₹</label><input id="ss" type="number"></div><div><label>Working days/month</label><input id="sw" type="number" value="26"></div><div><label>Overtime ₹/hour</label><input id="so" type="number" value="0"></div><div><label>Personal PIN</label><input id="si" type="password" inputmode="numeric" maxlength="6"></div></div><button class="primary" style="margin-top:10px" onclick="addStaff()">Add staff</button></div><div class="card"><h2>Staff List</h2>${D.staff.map(s=>`<div class="staff"><div><b>${esc(s.name)}</b><div class="muted">₹${(+s.salary||0).toLocaleString("en-IN")}/month</div></div><button class="red" onclick="removeStaff('${s.id}')">Delete</button></div>`).join("")||"No staff added."}</div>`}
function addStaff(){if(!sn.value.trim()||!/^[0-9]{4,6}$/.test(si.value))return alert("Enter a name and 4–6 digit PIN.");D.staff.push({id:id(),name:sn.value.trim(),phone:sp.value,salary:+ss.value||0,working:+sw.value||26,ot:+so.value||0,pin:si.value});save();render("staff")}
function removeStaff(x){if(confirm("Delete this staff member?")){D.staff=D.staff.filter(s=>s.id!=x);save();render("staff")}}
function start(staffId,type){let s=D.staff.find(x=>x.id==staffId);show(`<h2>${type=="in"?"Check in":"Check out"} — ${esc(s.name)}</h2><p class="muted">Use your own phone and enter your personal PIN.</p><input id="pin" type="password" inputmode="numeric" maxlength="6"><button class="primary" style="margin-top:10px" onclick="pinNext('${staffId}','${type}')">Scan QR</button><button class="outline" style="margin-top:8px;width:100%" onclick="closeModal()">Cancel</button>`)}
function pinNext(staffId,type){let s=D.staff.find(x=>x.id==staffId);if(pin.value!=s.pin)return alert("Wrong PIN.");scanQR(staffId,type)}
function scanQR(staffId,type){show(`<h2>Scan the live salon QR</h2><p class="muted">Point your camera at the QR displayed at reception. Screenshots/photos may be rejected if the token has expired.</p><div id="reader"></div><button class="outline" style="margin-top:8px;width:100%" onclick="stopScanner();closeModal()">Cancel</button>`);let q=new Html5Qrcode("reader");window.qrScanner=q;q.start({facingMode:"environment"},{fps:10,qrbox:{width:240,height:240}},txt=>{if(validToken(txt)){stopScanner();verifyLocation(staffId,type)}else alert("Invalid or expired salon QR. Scan the current QR.")},()=>{}).catch(e=>{document.getElementById("reader").innerHTML="<p>Camera could not start. Allow camera permission and use HTTPS.</p>"})}
function stopScanner(){if(window.qrScanner){window.qrScanner.stop().catch(()=>{});window.qrScanner.clear().catch(()=>{});window.qrScanner=null}}
function verifyLocation(staffId,type){if(!D.settings.lat||!D.settings.lng){alert("Manager must set the salon location in Settings first.");closeModal();return}show("<h2>Checking salon location…</h2><p class='muted'>Allow precise location.</p>");navigator.geolocation.getCurrentPosition(p=>{let m=distance(p.coords.latitude,p.coords.longitude,D.settings.lat,D.settings.lng);if(m>D.settings.radius){alert("Attendance rejected: you are outside the salon area.");closeModal();return}liveSelfie(staffId,type,Math.round(m))},()=>{alert("Precise GPS permission is required.");closeModal()},{enableHighAccuracy:true,timeout:12000,maximumAge:0})}
async function liveSelfie(staffId,type,m){show(`<h2>Mandatory live selfie</h2><video id="cam" autoplay playsinline></video><p class="muted">Take a live selfie to complete attendance.</p><button class="primary" onclick="capture('${staffId}','${type}',${m})">Capture selfie</button>`);try{window.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false});cam.srcObject=stream}catch(e){alert("Camera permission is required.");closeModal()}}
function capture(staffId,type,m){let v=cam,c=document.createElement("canvas");c.width=v.videoWidth||640;c.height=v.videoHeight||480;c.getContext("2d").drawImage(v,0,0,c.width,c.height);let photo=c.toDataURL("image/jpeg",.65),r=day()[staffId]||{staffId,status:"Present"};if(type=="in"){r.status="Present";r.in=clock();r.inSelfie=photo;r.inDistance=m;r.inISO=new Date().toISOString()}else{r.out=clock();r.outSelfie=photo;r.outDistance=m;r.outISO=new Date().toISOString()}day()[staffId]=r;if(stream)stream.getTracks().forEach(t=>t.stop());save();closeModal();render("attendance")}
function edit(staffId){let r=day()[staffId]||{};show(`<h2>Manager edit</h2><label>Status</label><select id="es"><option>Present</option><option>Absent</option><option>Leave</option><option>Half Day</option></select><label>Check-in</label><input id="ei" value="${r.in||""}"><label>Check-out</label><input id="eo" value="${r.out||""}"><button class="primary" style="margin-top:10px" onclick="saveEdit('${staffId}')">Save</button>`);es.value=r.status||"Present"}
function saveEdit(id){day()[id]={...(day()[id]||{}),staffId:id,status:es.value,in:ei.value,out:eo.value,managerEdited:new Date().toISOString()};save();closeModal();render()}
function monthly(){let m=new Date().toISOString().slice(0,7);app.innerHTML=`<div class="card"><h2>Monthly Attendance</h2><input id="month" type="month" value="${m}" onchange="monthly()"></div><div class="card"><table><tr><th>Staff</th><th>Present</th><th>Half</th><th>Leave</th><th>Absent</th></tr>${D.staff.map(s=>{let c=count(s.id,month?.value||m);return `<tr><td>${esc(s.name)}</td><td>${c.p}</td><td>${c.h}</td><td>${c.l}</td><td>${c.a}</td></tr>`}).join("")}</table></div>`}
function count(id,m){let o={p:0,h:0,l:0,a:0};for(let[d,x]of Object.entries(D.days))if(d.startsWith(m)&&x[id]){let q=x[id].status;if(q=="Present")o.p++;if(q=="Half Day")o.h++;if(q=="Leave")o.l++;if(q=="Absent")o.a++}return o}
function salary(){let m=new Date().toISOString().slice(0,7);app.innerHTML=`<div class="card"><h2>Automatic Salary</h2><p class="muted">Monthly salary − absent deduction − half-day deduction. Overtime/advances can be added in the manager edit system in the next cloud version.</p></div>${D.staff.map(s=>{let c=count(s.id,m),rate=(+s.salary||0)/(+s.working||26),pay=(+s.salary||0)-c.a*rate-c.h*.5*rate;return `<div class="card"><b>${esc(s.name)}</b><div class="grid"><div><small>Present</small><div class="kpi">${c.p}</div></div><div><small>Absent</small><div class="kpi">${c.a}</div></div><div><small>Half</small><div class="kpi">${c.h}</div></div><div><small>Payable</small><div class="kpi">₹${pay.toFixed(2)}</div></div></div></div>`}).join("")||`<div class="card">Add staff first.</div>`}
function settings(){app.innerHTML=`<div class="card"><h2>Salon Security</h2><p class="muted">Set the exact salon location once. Use your phone at the salon.</p><button class="primary" onclick="useLocation()">Use my current location</button><label>Latitude</label><input id="lat" value="${D.settings.lat??""}"><label>Longitude</label><input id="lng" value="${D.settings.lng??""}"><label>Allowed GPS radius (metres)</label><input id="rad" type="number" value="${D.settings.radius}"><label>QR validity (seconds)</label><input id="qrs" type="number" value="${D.settings.qrSeconds}"><button class="primary" style="margin-top:10px" onclick="saveSettings()">Save settings</button></div><div class="card"><b>Anti-proxy setup</b><p class="muted">Real camera QR scanner + short-lived QR + personal PIN + precise GPS + mandatory live selfie.</p></div>`}
function useLocation(){navigator.geolocation.getCurrentPosition(p=>{lat.value=p.coords.latitude;lng.value=p.coords.longitude;alert("Salon location captured. Tap Save settings.")},()=>alert("Allow precise location first."),{enableHighAccuracy:true,timeout:12000,maximumAge:0})}
function saveSettings(){if(!D.settings.qrSecret)D.settings.qrSecret=id().replaceAll("-","");D.settings.lat=+lat.value;D.settings.lng=+lng.value;D.settings.radius=+rad.value||100;D.settings.qrSeconds=Math.max(10,+qrs.value||15);save();alert("Settings saved.");render("settings")}
function reception(){if(!D.settings.qrSecret){D.settings.qrSecret=id().replaceAll("-","");save()}show(`<h2>Reception QR</h2><div class="qrbox"><img id="qrimg"></div><div class="timer" id="left"></div><p class="muted">Keep this screen open at reception. The QR changes every ${D.settings.qrSeconds} seconds.</p><button class="outline" style="width:100%" onclick="closeModal()">Close</button>`);updateQR();window.qrTimer=setInterval(updateQR,1000)}
function updateQR(){if(!document.getElementById("qrimg"))return;let remain=D.settings.qrSeconds-(Math.floor(Date.now()/1000)%D.settings.qrSeconds);left.textContent=remain+"s";qrimg.src="https://api.qrserver.com/v1/create-qr-code/?size=500x500&data="+encodeURIComponent(token())}
function show(x){box.innerHTML=x;modal.classList.remove("hide")}function closeModal(){stopScanner();if(window.stream)window.stream.getTracks().forEach(t=>t.stop());if(window.qrTimer)clearInterval(window.qrTimer);modal.classList.add("hide");box.innerHTML=""}
render();
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js");
</script></body></html>
