<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111"><link rel="manifest" href="manifest.json"><title>T&G Staff Attendance</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f4f4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;color:#111}header{background:#111;color:#fff;padding:18px 15px}header b{font-size:20px}header small{display:block;color:#bbb;margin-top:3px}nav{display:flex;gap:7px;overflow:auto;background:#fff;padding:10px;position:sticky;top:0;z-index:5}nav button{border:1px solid #ddd;background:#fff;border-radius:10px;padding:9px 12px;white-space:nowrap}nav .on{background:#111;color:#fff}main{max-width:850px;margin:auto;padding:12px}.card{background:#fff;border-radius:15px;padding:15px;margin:10px 0;box-shadow:0 2px 10px #0001}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:650px){.grid{grid-template-columns:repeat(4,1fr)}}label{font-size:12px;color:#555;display:block;margin:7px 0 4px}input,select{width:100%;padding:11px;border:1px solid #ccc;border-radius:9px;font-size:15px}button{cursor:pointer}.primary{background:#111;color:#fff;border:0;border-radius:10px;padding:11px 14px;font-weight:600}.danger{background:#b00020;color:#fff;border:0;border-radius:9px;padding:8px 10px}.green{background:#16803c;color:#fff;border:0;border-radius:9px;padding:8px 10px}.outline{background:#fff;border:1px solid #bbb;border-radius:10px;padding:9px 12px}.muted{color:#666;font-size:13px}.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#eee;font-size:12px}.present{background:#dff5e7}.absent{background:#ffe2e2}.leave{background:#fff0c9}.half{background:#e7e2ff}.notice{padding:10px;background:#f1f1f1;border-radius:10px;font-size:13px}.staff{display:flex;justify-content:space-between;gap:8px;align-items:center;border-top:1px solid #eee;padding:12px 0}.modal{position:fixed;inset:0;background:#000b;z-index:20;display:flex;align-items:center;justify-content:center;padding:14px}.box{background:#fff;border-radius:16px;padding:16px;width:100%;max-width:520px;max-height:92vh;overflow:auto}.hide{display:none!important}video{width:100%;border-radius:12px;background:#111}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid #eee;text-align:left}.kpi{font-size:24px;font-weight:700}</style></head><body>
<header><b>T&G Staff Attendance</b><small>TONI&GUY ESSENSUALS • RMV</small></header><nav id="nav"></nav><main id="app"></main><div id="modal" class="modal hide"><div class="box" id="box"></div></div><canvas id="canvas" style="display:none"></canvas>
<script>
const K="tg_attendance_v1";let D=JSON.parse(localStorage.getItem(K)||"null")||{staff:[],days:{},settings:{lat:12.9997,lng:77.5773,radius:150,qr:45}};const save=()=>localStorage.setItem(K,JSON.stringify(D)),today=()=>new Date().toISOString().slice(0,10),now=()=>new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});
function esc(x){return String(x||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function day(){return D.days[today()]||(D.days[today()]={})}
function dist(a,b,c,e){let R=6371000,p=Math.PI/180,x=(c-a)*p,y=(e-b)*p,q=Math.sin(x/2)**2+Math.cos(a*p)*Math.cos(c*p)*Math.sin(y/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
function tabs(t){nav.innerHTML=["attendance","staff","monthly","salary","settings"].map(x=>`<button class="${x==t?"on":""}" onclick="render('${x}')">${x[0].toUpperCase()+x.slice(1)}</button>`).join("")+`<button onclick="receptionQR()">Reception QR</button>`}
function render(t="attendance"){tabs(t);if(t=="attendance")attendance();if(t=="staff")staff();if(t=="monthly")monthly();if(t=="salary")salary();if(t=="settings")settings()}
function attendance(){let r=day();app.innerHTML=`<div class="card"><h2>Today's Attendance</h2><div class="muted">${new Date().toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"})}</div><p class="notice">Employee check-in/out: personal phone + changing QR + GPS + mandatory live selfie.</p></div><div class="grid">${D.staff.map(s=>{let x=r[s.id];return `<div class="card"><b>${esc(s.name)}</b><p>${x?`<span class="badge ${x.status=="Present"?"present":x.status=="Absent"?"absent":x.status=="Leave"?"leave":"half"}">${x.status}</span><br><span class="muted">In: ${x.in||"—"} &nbsp; Out: ${x.out||"—"}</span>`:`<span class="badge">Not checked in</span>`}</p>${x&&!x.out?`<button class="green" onclick="begin('${s.id}','out')">Check out</button>`:!x?`<button class="primary" onclick="begin('${s.id}','in')">Check in</button>`:""} <button class="outline" onclick="edit('${s.id}')">Manager edit</button></div>`}).join("")||`<div class="card">Add staff first.</div>`}</div>`}
function staff(){app.innerHTML=`<div class="card"><h2>Add Staff</h2><div class="grid"><div><label>Name</label><input id="n"></div><div><label>Phone</label><input id="ph" placeholder="+91"></div><div><label>Monthly salary ₹</label><input id="sal" type="number"></div><div><label>Working days/month</label><input id="wd" type="number" value="26"></div><div><label>Overtime ₹/hour</label><input id="ot" type="number"></div><div><label>Personal PIN</label><input id="pin" type="password" inputmode="numeric" maxlength="6"></div></div><button class="primary" onclick="add()">Add staff</button></div><div class="card"><h2>Staff</h2>${D.staff.map(s=>`<div class="staff"><div><b>${esc(s.name)}</b><div class="muted">₹${(+s.salary||0).toLocaleString("en-IN")}/month</div></div><button class="danger" onclick="del('${s.id}')">Delete</button></div>`).join("")||"No staff added."}</div>`}
function add(){if(!n.value.trim()||!/^[0-9]{4,6}$/.test(pin.value))return alert("Enter name and a 4–6 digit PIN.");D.staff.push({id:crypto.randomUUID(),name:n.value.trim(),phone:ph.value,salary:+sal.value||0,working:+wd.value||26,ot:+ot.value||0,pin:pin.value});save();render("staff")}
function del(id){if(confirm("Delete this staff member?")){D.staff=D.staff.filter(x=>x.id!=id);save();render("staff")}}
function begin(id,type){let s=D.staff.find(x=>x.id==id);show(`<h2>${type=="in"?"Check in":"Check out"} — ${esc(s.name)}</h2><p class="muted">Enter your personal PIN.</p><input id="pp" type="password" inputmode="numeric" maxlength="6"><button class="primary" style="margin-top:10px" onclick="pinOK('${id}','${type}')">Continue</button><button class="outline" style="margin-top:8px;width:100%" onclick="closeM()">Cancel</button>`)}
function pinOK(id,type){let s=D.staff.find(x=>x.id==id);if(pp.value!=s.pin)return alert("Wrong PIN.");show(`<h2>Scan live salon QR</h2><p class="muted">Ask reception to display the current QR token.</p><input id="qt" inputmode="numeric" placeholder="Current QR token"><button class="primary" style="margin-top:10px" onclick="qrOK('${id}','${type}')">Verify QR</button>`);setTimeout(()=>{},10)}
function token(){return Math.floor(Date.now()/1000/D.settings.qr)}
function qrOK(id,type){if(qt.value!=String(token()))return alert("QR expired/invalid. Scan the current salon QR.");if(!navigator.geolocation)return alert("GPS is required.");show("<h2>Checking location…</h2><p class='muted'>Allow location access.</p>");navigator.geolocation.getCurrentPosition(p=>{let m=dist(p.coords.latitude,p.coords.longitude,D.settings.lat,D.settings.lng);if(m>D.settings.radius){alert("Rejected: outside salon location.");closeM();return}takeSelfie(id,type,Math.round(m))},()=>{alert("GPS permission is required.");closeM()},{enableHighAccuracy:true,timeout:10000,maximumAge:0})}
async function takeSelfie(id,type,m){show(`<h2>Live selfie required</h2><video id="vid" autoplay playsinline></video><p class="muted">Take a live selfie to finish attendance.</p><button class="primary" onclick="capture('${id}','${type}',${m})">Capture selfie</button>`);try{window.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false});vid.srcObject=stream}catch(e){alert("Camera permission is required.");closeM()}}
function capture(id,type,m){let v=vid,c=canvas;c.width=v.videoWidth||640;c.height=v.videoHeight||480;c.getContext("2d").drawImage(v,0,0,c.width,c.height);let photo=c.toDataURL("image/jpeg",.65),r=day()[id]||{staffId:id,status:"Present"};if(type=="in"){r.status="Present";r.in=now();r.inSelfie=photo;r.inDistance=m}else{r.out=now();r.outSelfie=photo;r.outDistance=m}day()[id]=r;if(stream)stream.getTracks().forEach(x=>x.stop());save();closeM();render("attendance")}
function show(x){box.innerHTML=x;modal.classList.remove("hide")}function closeM(){modal.classList.add("hide");box.innerHTML=""}
function edit(id){let r=day()[id]||{};show(`<h2>Manager edit</h2><label>Status</label><select id="st"><option>Present</option><option>Absent</option><option>Leave</option><option>Half Day</option></select><label>Check-in</label><input id="ci" value="${r.in||""}"><label>Check-out</label><input id="co" value="${r.out||""}"><button class="primary" style="margin-top:10px" onclick="saveEdit('${id}')">Save</button>`);st.value=r.status||"Present"}
function saveEdit(id){day()[id]={...(day()[id]||{}),staffId:id,status:st.value,in:ci.value,out:co.value,managerEdit:new Date().toISOString()};save();closeM();render()}
function monthly(){let m=new Date().toISOString().slice(0,7);app.innerHTML=`<div class="card"><h2>Monthly Attendance</h2><input id="mm" type="month" value="${m}" onchange="monthly()"></div><div class="card"><table><tr><th>Staff</th><th>Present</th><th>Half</th><th>Leave</th><th>Absent</th></tr>${D.staff.map(s=>{let c=count(s.id,mm?.value||m);return `<tr><td>${esc(s.name)}</td><td>${c.p}</td><td>${c.h}</td><td>${c.l}</td><td>${c.a}</td></tr>`}).join("")}</table></div>`}
function count(id,m){let o={p:0,h:0,l:0,a:0};for(let [d,x] of Object.entries(D.days))if(d.startsWith(m)&&x[id]){let q=x[id].status;if(q=="Present")o.p++;if(q=="Half Day")o.h++;if(q=="Leave")o.l++;if(q=="Absent")o.a++}return o}
function salary(){let m=new Date().toISOString().slice(0,7);app.innerHTML=`<div class="card"><h2>Automatic Salary</h2><p class="muted">Salary = monthly salary − absent/half-day deductions + overtime − advances/deductions.</p></div>${D.staff.map(s=>{let c=count(s.id,m),rate=(+s.salary||0)/(+s.working||26),pay=(+s.salary||0)-c.a*rate-c.h*.5*rate;return `<div class="card"><b>${esc(s.name)}</b><div class="grid"><div><small>Present</small><div class="kpi">${c.p}</div></div><div><small>Absent</small><div class="kpi">${c.a}</div></div><div><small>Half</small><div class="kpi">${c.h}</div></div><div><small>Payable</small><div class="kpi">₹${pay.toFixed(2)}</div></div></div></div>`}).join("")}`}
function settings(){app.innerHTML=`<div class="card"><h2>Security Settings</h2><label>Salon latitude</label><input id="la" value="${D.settings.lat}"><label>Salon longitude</label><input id="lo" value="${D.settings.lng}"><label>Allowed radius (metres)</label><input id="ra" type="number" value="${D.settings.radius}"><label>QR validity (seconds)</label><input id="qq" type="number" value="${D.settings.qr}"><button class="primary" style="margin-top:10px" onclick="saveSet()">Save</button></div><div class="card"><p class="muted">Attendance data is stored on this device/browser. Multi-phone cloud sync requires a backend/database.</p></div>`}
function saveSet(){D.settings={lat:+la.value,lng:+lo.value,radius:+ra.value,qr:+qq.value};save();alert("Saved.")}
function receptionQR(){show(`<h2>Reception QR Token</h2><div style="font-size:38px;text-align:center;padding:25px;border:2px dashed #111;border-radius:12px"><b id="tok">${token()}</b></div><p class="muted">Changes every ${D.settings.qr} seconds. Keep this screen at reception. A screenshot/WhatsApp copy will expire.</p>`);let z=setInterval(()=>{if(modal.classList.contains("hide")){clearInterval(z)}else tok.textContent=token()},500)}
render();if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js");
</script></body></html>
