<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111"><link rel="manifest" href="manifest.json"><title>T&G Staff Attendance</title><script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>*{box-sizing:border-box}body{margin:0;background:#f4f4f4;color:#111;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}header{background:#111;color:#fff;padding:18px 15px}header b{font-size:20px}header small{display:block;color:#bbb;margin-top:3px}nav{display:flex;gap:7px;overflow:auto;background:#fff;padding:10px;position:sticky;top:0;z-index:5;border-bottom:1px solid #ddd}nav button{border:1px solid #ddd;background:#fff;border-radius:10px;padding:9px 12px;white-space:nowrap}nav button.active{background:#111;color:#fff}main{max-width:900px;margin:auto;padding:12px}.card{background:#fff;border-radius:15px;padding:15px;margin:10px 0;box-shadow:0 2px 10px #0001}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}label{display:block;font-size:12px;color:#555;margin:7px 0 4px}input,select{width:100%;padding:11px;border:1px solid #ccc;border-radius:9px;font-size:15px;background:#fff}button{cursor:pointer}.primary{background:#111;color:#fff;border:0;border-radius:10px;padding:11px 14px;font-weight:600}.green{background:#16803c;color:#fff;border:0;border-radius:10px;padding:10px 12px}.red{background:#b00020;color:#fff;border:0;border-radius:10px;padding:9px 11px}.outline{background:#fff;border:1px solid #aaa;border-radius:10px;padding:9px 12px}.muted{color:#666;font-size:13px}.notice{background:#f0f0f0;border-radius:10px;padding:10px;font-size:13px}.badge{display:inline-block;padding:4px 8px;border-radius:20px;background:#eee;font-size:12px}.present{background:#dff5e7}.absent{background:#ffe0e0}.leave{background:#fff0c8}.half{background:#e8e2ff}.staff{border-top:1px solid #eee;padding:12px 0;display:flex;justify-content:space-between;gap:10px;align-items:center}.modal{position:fixed;inset:0;background:#000b;z-index:20;display:flex;align-items:center;justify-content:center;padding:12px}.modal.hidden{display:none}.box{background:#fff;border-radius:16px;padding:16px;width:100%;max-width:520px;max-height:94vh;overflow:auto}#reader{width:100%;min-height:260px}.qr{display:block;width:min(80vw,380px);height:min(80vw,380px);margin:10px auto}.timer{text-align:center;font-size:28px;font-weight:700}.video{width:100%;border-radius:12px;background:#111}.kpi{font-size:24px;font-weight:700}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid #eee;text-align:left}</style></head><body><header><b>T&G Staff Attendance</b><small>TONI&GUY ESSENSUALS • RMV</small></header><nav id="nav"></nav><main id="app"></main><div id="modal" class="modal hidden"><div id="box" class="box"></div></div><script>
(function(){
var KEY="tg_staff_attendance_v3";
var saved=null;try{saved=JSON.parse(localStorage.getItem(KEY)||"null")}catch(e){}
var D=saved||{staff:[],days:{},settings:{lat:null,lng:null,radius:100,qrSeconds:15,secret:null}};
var app=document.getElementById("app"),nav=document.getElementById("nav"),modal=document.getElementById("modal"),box=document.getElementById("box");
var scanner=null,stream=null,qrTimer=null;
function save(){localStorage.setItem(KEY,JSON.stringify(D))}function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}function today(){return new Date().toISOString().slice(0,10)}function clock(){return new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"})}function day(){if(!D.days[today()])D.days[today()]={};return D.days[today()]}
function esc(x){return String(x==null?"":x).replace(/[&<>"']/g,function(m){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]})}
function dist(a,b,c,d){var R=6371000,p=Math.PI/180,x=(c-a)*p,y=(d-b)*p,q=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*p)*Math.cos(c*p)*Math.sin(y/2)*Math.sin(y/2);return 2*R*Math.asin(Math.sqrt(q))}
function token(){if(!D.settings.secret)D.settings.secret=uid();return "TGATT|"+D.settings.secret+"|"+Math.floor(Date.now()/1000/D.settings.qrSeconds)}
function valid(v){var z=String(v||"").split("|");return z.length===3&&z[0]==="TGATT"&&z[1]===D.settings.secret&&z[2]===String(Math.floor(Date.now()/1000/D.settings.qrSeconds))}
function show(s){box.innerHTML=s;modal.classList.remove("hidden")}function close(){stopScan();if(stream){stream.getTracks().forEach(function(t){t.stop()});stream=null}if(qrTimer){clearInterval(qrTimer);qrTimer=null}modal.classList.add("hidden");box.innerHTML=""}
window.closeModal=close;
function tabs(t){nav.innerHTML="";["attendance","staff","monthly","salary","settings"].forEach(function(x){var b=document.createElement("button");b.textContent=x.charAt(0).toUpperCase()+x.slice(1);if(x===t)b.className="active";b.onclick=function(){render(x)};nav.appendChild(b)});var r=document.createElement("button");r.textContent="Reception QR";r.onclick=reception;nav.appendChild(r)}
function render(t){tabs(t);if(t==="attendance")attendance();else if(t==="staff")staff();else if(t==="monthly")monthly();else if(t==="salary")salary();else settings()}
function attendance(){var r=day(),html='<div class="card"><h2>Today’s Attendance</h2><div class="muted">'+new Date().toLocaleDateString(undefined,{weekday:"long",year:"numeric",month:"long",day:"numeric"})+'</div><p class="notice"><b>Anti-proxy:</b> real QR scan + personal PIN + GPS + mandatory live selfie.</p></div><div class="grid">';if(!D.staff.length)html+='<div class="card">Add staff first.</div>';D.staff.forEach(function(s){var x=r[s.id],b=x?'<span class="badge '+(x.status==="Present"?"present":x.status==="Absent"?"absent":x.status==="Leave"?"leave":"half")+'">'+esc(x.status)+'</span>':'<span class="badge">Not checked in</span>';html+='<div class="card"><b>'+esc(s.name)+'</b><p>'+b+'<br><span class="muted">In: '+(x&&x.in||"—")+'<br>Out: '+(x&&x.out||"—")+'</span></p>'+(x&&!x.out?'<button class="green" onclick="startAttendance(\''+s.id+'\',\'out\')">Check out</button>':!x?'<button class="primary" onclick="startAttendance(\''+s.id+'\',\'in\')">Check in</button>':'')+' <button class="outline" onclick="managerEdit(\''+s.id+'\')">Manager edit</button></div>'});html+='</div>';app.innerHTML=html}
window.startAttendance=function(id,type){var s=D.staff.find(function(x){return x.id===id});show('<h2>'+(type==="in"?"Check in":"Check out")+' — '+esc(s.name)+'</h2><p class="muted">Enter your personal PIN on your own phone.</p><input id="pinInput" type="password" inputmode="numeric" maxlength="6"><button class="primary" style="margin-top:10px" onclick="pinNext(\''+id+'\',\''+type+'\')">Continue to QR scan</button><button class="outline" style="margin-top:8px;width:100%" onclick="closeModal()">Cancel</button>')}
window.pinNext=function(id,type){var s=D.staff.find(function(x){return x.id===id});if(document.getElementById("pinInput").value!==s.pin){alert("Wrong PIN.");return}scanQR(id,type)};
function scanQR(id,type){if(typeof window.Html5Qrcode!=="function"){alert("QR scanner is still loading. Wait a few seconds and try again.");return}show('<h2>Scan live salon QR</h2><p class="muted">Scan the QR displayed at reception. A photo/WhatsApp copy will only work while its short-lived token is valid.</p><div id="reader"></div><button class="outline" style="margin-top:8px;width:100%" onclick="closeModal()">Cancel</button>');scanner=new Html5Qrcode("reader");scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:240,height:240}},function(text){if(valid(text)){stopScan();verifyLocation(id,type)}else{alert("Invalid or expired QR. Scan the current reception QR.")}},function(){}).catch(function(){var rd=document.getElementById("reader");if(rd)rd.innerHTML="<p>Camera could not start. Allow camera access and use Safari/HTTPS.</p>"})}
function stopScan(){if(scanner){try{scanner.stop().catch(function(){})}catch(e){}try{scanner.clear()}catch(e){}scanner=null}}
function verifyLocation(id,type){if(!D.settings.lat||!D.settings.lng){alert("Manager must set the salon location first in Settings.");close();return}show('<h2>Checking location…</h2><p class="muted">Allow precise location when Safari asks.</p>');if(!navigator.geolocation){alert("This phone does not provide GPS.");close();return}navigator.geolocation.getCurrentPosition(function(p){var m=dist(p.coords.latitude,p.coords.longitude,D.settings.lat,D.settings.lng);if(m>D.settings.radius){alert("Attendance rejected: outside salon area.");close();return}selfie(id,type,Math.round(m))},function(){alert("Precise GPS permission is required.");close()},{enableHighAccuracy:true,timeout:15000,maximumAge:0})}
async function selfie(id,type,m){show('<h2>Mandatory live selfie</h2><video id="selfieVideo" class="video" autoplay playsinline></video><p class="muted">Take a live selfie to finish attendance.</p><button class="primary" onclick="captureSelfie(\''+id+'\',\''+type+'\','+m+')">Capture selfie</button>');try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false});document.getElementById("selfieVideo").srcObject=stream}catch(e){alert("Camera permission is required for the selfie.");close()}}
window.captureSelfie=function(id,type,m){var v=document.getElementById("selfieVideo"),c=document.createElement("canvas");c.width=v.videoWidth||640;c.height=v.videoHeight||480;c.getContext("2d").drawImage(v,0,0,c.width,c.height);var r=day()[id]||{staffId:id,status:"Present"};if(type==="in"){r.status="Present";r.in=clock();r.inSelfie=c.toDataURL("image/jpeg",0.65);r.inDistance=m;r.inISO=new Date().toISOString()}else{r.out=clock();r.outSelfie=c.toDataURL("image/jpeg",0.65);r.outDistance=m;r.outISO=new Date().toISOString()}day()[id]=r;save();close();render("attendance")}
function staff(){var h='<div class="card"><h2>Add Staff</h2><div class="grid"><div><label>Name</label><input id="sName"></div><div><label>Phone</label><input id="sPhone"></div><div><label>Monthly salary ₹</label><input id="sSalary" type="number"></div><div><label>Working days/month</label><input id="sWorking" type="number" value="26"></div><div><label>Overtime ₹/hour</label><input id="sOT" type="number" value="0"></div><div><label>Personal PIN</label><input id="sPIN" type="password" inputmode="numeric" maxlength="6"></div></div><button class="primary" style="margin-top:10px" onclick="addStaff()">Add staff</button></div><div class="card"><h2>Staff List</h2>';if(!D.staff.length)h+='No staff added.';D.staff.forEach(function(s){h+='<div class="staff"><div><b>'+esc(s.name)+'</b><div class="muted">₹'+Number(s.salary||0).toLocaleString("en-IN")+'/month</div></div><button class="red" onclick="removeStaff(\''+s.id+'\')">Delete</button></div>'});h+='</div>';app.innerHTML=h}
window.addStaff=function(){var n=document.getElementById("sName").value.trim(),p=document.getElementById("sPIN").value;if(!n||!/^[0-9]{4,6}$/.test(p)){alert("Enter name and a 4–6 digit PIN.");return}D.staff.push({id:uid(),name:n,phone:document.getElementById("sPhone").value,salary:Number(document.getElementById("sSalary").value)||0,working:Number(document.getElementById("sWorking").value)||26,ot:Number(document.getElementById("sOT").value)||0,pin:p});save();render("staff")};window.removeStaff=function(id){if(confirm("Delete this staff member?")){D.staff=D.staff.filter(function(s){return s.id!==id});save();render("staff")}}
function managerEdit(id){var r=day()[id]||{};show('<h2>Manager edit</h2><label>Status</label><select id="editStatus"><option>Present</option><option>Absent</option><option>Leave</option><option>Half Day</option></select><label>Check-in</label><input id="editIn" value="'+esc(r.in||"")+'"><label>Check-out</label><input id="editOut" value="'+esc(r.out||"")+'"><button class="primary" style="margin-top:10px" onclick="saveEdit(\''+id+'\')">Save</button>');document.getElementById("editStatus").value=r.status||"Present"}
window.managerEdit=managerEdit;window.saveEdit=function(id){day()[id]={...(day()[id]||{}),staffId:id,status:document.getElementById("editStatus").value,in:document.getElementById("editIn").value,out:document.getElementById("editOut").value,managerEdited:new Date().toISOString()};save();close();render("attendance")}
function count(id,m){var o={p:0,h:0,l:0,a:0};Object.keys(D.days).forEach(function(d){var x=D.days[d][id];if(d.indexOf(m)===0&&x){if(x.status==="Present")o.p++;if(x.status==="Half Day")o.h++;if(x.status==="Leave")o.l++;if(x.status==="Absent")o.a++}});return o}
function monthly(){var m=today().slice(0,7),h='<div class="card"><h2>Monthly Attendance</h2><input id="monthSelect" type="month" value="'+m+'"></div><div class="card"><table><tr><th>Staff</th><th>Present</th><th>Half</th><th>Leave</th><th>Absent</th></tr>';D.staff.forEach(function(s){var c=count(s.id,m);h+='<tr><td>'+esc(s.name)+'</td><td>'+c.p+'</td><td>'+c.h+'</td><td>'+c.l+'</td><td>'+c.a+'</td></tr>'});h+='</table></div>';app.innerHTML=h}
function salary(){var m=today().slice(0,7),h='<div class="card"><h2>Automatic Salary</h2><p class="muted">Monthly salary − absent deduction − half-day deduction. Working days are editable per staff.</p></div>';D.staff.forEach(function(s){var c=count(s.id,m),rate=Number(s.salary||0)/Number(s.working||26),pay=Number(s.salary||0)-c.a*rate-c.h*0.5*rate;h+='<div class="card"><b>'+esc(s.name)+'</b><div class="grid"><div><small>Present</small><div class="kpi">'+c.p+'</div></div><div><small>Absent</small><div class="kpi">'+c.a+'</div></div><div><small>Half</small><div class="kpi">'+c.h+'</div></div><div><small>Payable</small><div class="kpi">₹'+pay.toFixed(2)+'</div></div></div></div>'});app.innerHTML=h}
function settings(){app.innerHTML='<div class="card"><h2>Salon Security</h2><p class="muted">Set the exact salon location once. Use this button while you are physically inside the salon.</p><button class="primary" onclick="getSalonLocation()">Use my current location</button><label>Latitude</label><input id="setLat" value="'+(D.settings.lat==null?"":D.settings.lat)+'"><label>Longitude</label><input id="setLng" value="'+(D.settings.lng==null?"":D.settings.lng)+'"><label>Allowed GPS radius (metres)</label><input id="setRadius" type="number" value="'+D.settings.radius+'"><label>QR validity (seconds)</label><input id="setQR" type="number" value="'+D.settings.qrSeconds+'"><button class="primary" style="margin-top:10px" onclick="saveSettings()">Save settings</button></div><div class="card"><b>Security</b><p class="muted">Real camera QR scanner + expiring QR + personal PIN + precise GPS + mandatory live selfie.</p></div>'}
window.getSalonLocation=function(){navigator.geolocation.getCurrentPosition(function(p){document.getElementById("setLat").value=p.coords.latitude;document.getElementById("setLng").value=p.coords.longitude;alert("Location captured. Tap Save settings.")},function(){alert("Allow precise location first.")},{enableHighAccuracy:true,timeout:15000,maximumAge:0})};window.saveSettings=function(){D.settings.lat=Number(document.getElementById("setLat").value);D.settings.lng=Number(document.getElementById("setLng").value);D.settings.radius=Math.max(30,Number(document.getElementById("setRadius").value)||100);D.settings.qrSeconds=Math.max(10,Number(document.getElementById("setQR").value)||15);if(!D.settings.secret)D.settings.secret=uid();save();alert("Security settings saved.");render("settings")}
function reception(){if(!D.settings.secret){D.settings.secret=uid();save()}show('<h2>Reception QR</h2><img id="receptionQR" class="qr"><div id="qrCountdown" class="timer"></div><p class="muted">Display this screen at reception. The QR changes every '+D.settings.qrSeconds+' seconds.</p><button class="outline" style="width:100%" onclick="closeModal()">Close</button>');updateReceptionQR();qrTimer=setInterval(updateReceptionQR,1000)}
function updateReceptionQR(){var img=document.getElementById("receptionQR"),cd=document.getElementById("qrCountdown");if(!img||!cd)return;var sec=D.settings.qrSeconds-(Math.floor(Date.now()/1000)%D.settings.qrSeconds);cd.textContent=sec+"s";img.src="https://api.qrserver.com/v1/create-qr-code/?size=500x500&data="+encodeURIComponent(token())}
render("attendance");if("serviceWorker" in navigator)navigator.serviceWorker.register("./sw.js");
})();
</script></body></html>
